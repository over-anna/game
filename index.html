<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotlight!</title>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css">
  <link rel="stylesheet" href="./styles/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-sm navbar-dark sticky-top p-0">
    <div class="container-fluid flex-column align-items-stretch px-0">

      <div class="w-100 px-3 py-2 d-flex align-items-center">
        <a class="navbar-brand fw-bold mb-0">spotlight!</a>

        <h4 class="ms-auto me-3">Arrange each of them in the spotlight!</h4>
      </div>
    </div>
  </nav>

  <!-- drop places -->
  <div id="droppable1" class="ui-widget-header"></div>
  <div id="droppable2" class="ui-widget-header"></div>
  <div id="droppable3" class="ui-widget-header"></div>
  <div id="droppable4" class="ui-widget-header"></div>

  <!-- drag rockers -->
  <div class="d-flex justify-content-center align-items-center gap-4">

    <div id="draggable1" class="ui-widget-content">
      <p><img
          src="https://static.vecteezy.com/system/resources/thumbnails/055/281/612/small_2x/silhouette-of-a-man-playing-guitar-on-transparent-background-free-png.png"></img>
      </p>
    </div>
    <div id="draggable2" class="ui-widget-content">
      <p><img src="https://cdn.creazilla.com/silhouettes/7950405/rockstar-silhouette-000000-xl.png"></img>
      </p>
    </div>
    <div id="draggable3" class="ui-widget-content">
      <p><img
          src="https://images.vexels.com/media/users/3/145842/isolated/lists/237d6207c72953ee593d9cfb2e66aebc-singer-singing-silhouette.png"></img>
      </p>
    </div>
    <div id="draggable4" class="ui-widget-content">
      <p><img
          src="https://images.vexels.com/media/users/3/145638/isolated/lists/50fd8272d07a41e22f876ca1de2b89f6-drummer-solo-silhouette.png"></img>
      </p>
    </div>
  </div>


  <!-- scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.js"></script>

  <script type="module">
    import { dragChoice } from './scripts/choice-script.js';

    document.addEventListener("DOMContentLoaded", () => {
      dragChoice();
    });
  </script>

  <footer class="mt-auto py-3 border-top">
    <div class="container">
      <div class="d-flex justify-content-center align-items-center gap-4 small text-muted flex-wrap">

        <a href="https://github.com/over-anna/spotlight"
          class="text-decoration-none text-muted border border-secondary-subtle rounded-pill px-3 py-1" target="_blank">
          &lt; <i class="bi bi-github"></i> source code &gt;
        </a>

        <span>
          &copy; 2026 Spotlight
        </span>

        <a href="https://validator.nu/?doc=https%3A%2F%2Fover-anna.github.io%2Fspotlight%2F"
          class="text-decoration-none text-muted border border-secondary-subtle rounded-pill px-3 py-1" target="_blank">
          Nu Verification
        </a>

        <a href="https://github.com/over-anna"
          class="text-decoration-none text-muted border border-secondary-subtle rounded-pill px-3 py-1" target="_blank">
          <i class="bi bi-github"></i>
          <i class="bi bi-person-circle"></i>
          GitHub Profile
        </a>

      </div>
    </div>

    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080;"></div>
  </footer>

</body>


</html>
